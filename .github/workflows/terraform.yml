name: Terraform (HCP CLI-driven)

# Caller workflow. Maps each trigger to the reusable tf-run.yml:
#   PR            -> validate once, then matrix plan (dev + prod)
#   push to main  -> apply dev, then create prod run (confirmed in HCP)
#   manual        -> run a chosen action against a chosen environment
#
# All init/plan/apply logic lives in .github/workflows/tf-run.yml so it isn't
# duplicated across triggers.
on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.tf.json"
      - "apps/**/*.yaml"
      - ".github/workflows/*.yml"
  push:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.tf.json"
      - "apps/**/*.yaml"
      - ".github/workflows/*.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to target
        # `type: environment` renders a dropdown populated from the repo's
        # configured Environments (Settings -> Environments: dev, prod).
        type: environment
        required: true
      action:
        description: Terraform action to run
        type: choice
        options:
          - plan
          - apply
        default: plan
        required: true

# Least privilege: nothing here writes to the PR, so read-only is enough.
permissions:
  contents: read

# Serialize main-branch promotions so commits can't apply out of order, key
# manual runs per environment, and supersede stale PR plans. Deployments are
# never cancelled mid-flight.
concurrency:
  group: >-
    terraform-${{
      github.event_name == 'push' && 'main-promotion'
      || github.event_name == 'workflow_dispatch' && format('manual-{0}', inputs.environment)
      || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # PR: static checks — environment-agnostic, so run ONCE. Kept as a normal job
  # (not a tf-run call): -backend=false means no workspace and no HCP token.
  # ---------------------------------------------------------------------------
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8" # pin the CLI; bump deliberately

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (providers + modules only)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  # ---------------------------------------------------------------------------
  # PR: speculative remote plan per environment (matrix over the reusable job).
  # ---------------------------------------------------------------------------
  plan:
    if: github.event_name == 'pull_request'
    needs: validate
    strategy:
      matrix:
        environment: [dev, prod]
    uses: ./.github/workflows/tf-run.yml
    with:
      environment: ${{ matrix.environment }}
      action: plan
    secrets:
      tf_api_token: ${{ secrets.TF_API_TOKEN }}

  # ---------------------------------------------------------------------------
  # main: apply dev automatically (auto_approve), then create the prod run with
  # auto_approve=false so it parks in HCP for a human to Confirm & Apply.
  # ---------------------------------------------------------------------------
  apply-dev:
    if: github.event_name == 'push'
    uses: ./.github/workflows/tf-run.yml
    with:
      environment: dev
      action: apply
      auto_approve: true
    secrets:
      tf_api_token: ${{ secrets.TF_API_TOKEN }}

  apply-prod:
    if: github.event_name == 'push'
    needs: apply-dev
    uses: ./.github/workflows/tf-run.yml
    with:
      environment: prod
      action: apply
      auto_approve: false
    secrets:
      tf_api_token: ${{ secrets.TF_API_TOKEN }}

  # ---------------------------------------------------------------------------
  # Manual run (Actions tab -> Run workflow): pick environment + action.
  # prod applies use auto_approve=false, so they park in HCP like the push path.
  # ---------------------------------------------------------------------------
  manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/tf-run.yml
    with:
      environment: ${{ inputs.environment }}
      action: ${{ inputs.action }}
      auto_approve: ${{ inputs.environment != 'prod' }}
    secrets:
      tf_api_token: ${{ secrets.TF_API_TOKEN }}
